<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Verification Marketplace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1117;--card:#161b26;--line:#242c3b;--txt:#e8edf5;--mut:#8b98ad;--acc:#2ea6ff;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:15px}
h1{font-size:19px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.bal{background:linear-gradient(135deg,#1b3a5c,#123a2a);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.bal b{font-size:24px;display:block;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.name{font-weight:600}
.price{color:var(--ok);font-weight:700;white-space:nowrap}
.qty{width:100%;background:#0b0f16;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:16px;margin-top:6px}
.btn{width:100%;background:var(--acc);border:0;color:#04121f;font-weight:700;padding:15px;border-radius:12px;font-size:16px;margin-top:12px}
.btn:disabled{opacity:.45}
.total{display:flex;justify-content:space-between;margin-top:14px;font-size:15px}
.warn{color:#fbbf24;font-size:12px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<h1>Verification Marketplace</h1>
<div class="mut" id="uid">Loading...</div>
<div class="bal"><span class="mut">Your balance</span><b id="bal">0 USDT</b></div>
<div id="services"></div>
<div class="mut" style="margin-top:16px">Quantity in thousands of rows (1 = 1000 numbers)</div>
<input class="qty" id="qty" type="number" min="1" step="1" value="1" inputmode="numeric">
<div class="total"><span class="mut">Order total</span><b id="total">0 USDT</b></div>
<button class="btn" id="go" disabled>Confirm Order</button>
<div class="warn" id="warn"></div>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
var params = new URLSearchParams(location.search);
var SERVICES = [
  {key:"tg", label:"Telegram", price:params.get("tg")},
  {key:"ws", label:"WhatsApp", price:params.get("ws")},
  {key:"binance", label:"Binance", price:params.get("binance")},
  {key:"amazon", label:"Amazon", price:params.get("amazon")},
  {key:"phoneCheck", label:"Phone Check", price:params.get("phoneCheck")}
];
var chosen = null;
document.getElementById("uid").textContent = "User ID: " + (params.get("uid") || "unknown");
document.getElementById("bal").textContent = (params.get("bal") || "0") + " USDT";
var host = document.getElementById("services");
for (var i = 0; i < SERVICES.length; i++) {
  (function(s){
    var p = parseFloat(s.price);
    if (isNaN(p)) { p = 0; }
    s.priceNum = p;
    var d = document.createElement("div");
    d.className = "card";
    var left = document.createElement("div");
    var n1 = document.createElement("div");
    n1.className = "name";
    n1.textContent = s.label;
    var n2 = document.createElement("div");
    n2.className = "mut";
    n2.textContent = "price per 1000 numbers";
    left.appendChild(n1);
    left.appendChild(n2);
    var right = document.createElement("div");
    right.className = "price";
    right.textContent = p.toFixed(2) + " USDT";
    d.appendChild(left);
    d.appendChild(right);
    d.onclick = function(){
      var all = host.children;
      for (var j = 0; j < all.length; j++) { all[j].className = "card"; }
      d.className = "card sel";
      chosen = s;
      update();
    };
    host.appendChild(d);
  })(SERVICES[i]);
}
function update(){
  var q = parseInt(document.getElementById("qty").value || "0", 10);
  if (isNaN(q) || q < 0) { q = 0; }
  var t = chosen ? chosen.priceNum * q : 0;
  document.getElementById("total").textContent = t.toFixed(2) + " USDT";
  var btn = document.getElementById("go");
  btn.disabled = !(chosen && q > 0);
  btn.textContent = (chosen && q > 0) ? ("Confirm Order - " + t.toFixed(2) + " USDT") : "Confirm Order";
}
document.getElementById("qty").addEventListener("input", update);
document.getElementById("go").onclick = function(){
  if (!chosen) { return; }
  var q = parseInt(document.getElementById("qty").value || "0", 10);
  if (isNaN(q) || q <= 0) { return; }
  var payload = {task_type: chosen.key, qty: q};
  var text = JSON.stringify(payload);
  try {
    if (!tg) { throw new Error("not in telegram"); }
    tg.sendData(text);
  } catch (e) {
    document.getElementById("warn").textContent = "Open this page from the Marketplace keyboard button inside the bot chat, then data can be sent back.";
  }
};
update();
</script>
</body>
</html>
